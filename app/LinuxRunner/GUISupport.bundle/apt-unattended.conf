// LinuxRunner's own installs run without a terminal. A package that ships a
// newer version of a configuration file the system changed makes dpkg ask
// (keep/replace) and wait forever. Answer as dpkg's default does: keep the
// current file (the package's version is saved as .dpkg-dist) unless the file
// was never changed, then take the new one. Used only through APT_CONFIG by
// LinuxRunner's scripts; apt in the user's terminal is unaffected.
Dpkg::Options { "--force-confdef"; "--force-confold"; };
