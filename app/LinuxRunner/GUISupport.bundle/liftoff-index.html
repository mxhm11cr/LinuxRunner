<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liftoff</title>
<style>
  body{font:17px/1.5 -apple-system,system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;
       background:linear-gradient(135deg,#1e1b4b,#7c3aed 55%,#f97316);color:#fff}
  main{max-width:34rem;padding:2rem}
  h1{font-size:2.6rem;margin:0 0 .4rem}
  code{background:#0005;padding:.15rem .45rem;border-radius:.45rem;font-size:.92em}
  .card{background:#ffffff1f;border:1px solid #ffffff33;border-radius:1.1rem;padding:1rem 1.2rem;margin-top:1.2rem}
</style>
</head>
<body>
<main>
  <h1>🚀 Liftoff</h1>
  <p>This page is served by Linux running on your iPhone in LinuxRunner.</p>
  <div class="card">
    <p><b>Make it yours:</b> edit <code>~/Sites/index.html</code>, or put a whole site in <code>~/Sites</code>.</p>
    <p><b>Run your own app:</b> start any dev server on <code>0.0.0.0</code>, for example
      <code>npm run dev -- --host</code> or <code>python3 app.py</code>, and open its port the same way.</p>
  </div>
</main>
</body>
</html>
